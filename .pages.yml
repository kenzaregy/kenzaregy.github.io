media:
  input: public/images
  output: /images

content:
  - name: projects
    label: Projets
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    view:
      fields: [title, date, featured, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: description
        label: Description courte
        type: text
      - name: date
        label: Date
        type: string
        required: true
      - name: cover
        label: Image de couverture
        type: image
      - name: tags
        label: Tags
        type: string
        list: true
      - name: link
        label: Lien du projet
        type: string
      - name: repo
        label: Lien du code source
        type: string
      - name: featured
        label: À la une (page d'accueil)
        type: boolean
        default: false
      - name: draft
        label: Brouillon (masqué)
        type: boolean
        default: false
      - name: body
        label: Contenu
        type: rich-text

  - name: settings
    label: Paramètres du site
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Votre nom
        type: string
        required: true
      - name: role
        label: Métier / titre
        type: string
      - name: tagline
        label: Accroche (page d'accueil)
        type: text
      - name: about
        label: À propos (ligne vide = nouveau paragraphe)
        type: text
      - name: avatar
        label: Avatar
        type: image
      - name: aboutImage
        label: Grande image (page À propos)
        type: image
      - name: expertise
        label: Domaines d'expertise
        type: string
        list: true
      - name: email
        label: E-mail
        type: string
      - name: phone
        label: Téléphone
        type: string
      - name: socials
        label: Réseaux sociaux
        type: object
        list: true
        fields:
          - name: label
            label: Nom
            type: string
          - name: url
            label: URL
            type: string
